name: piplock_ai
description: "PipLock AI - Disciplina forzata per trader. Killswitch, AI Planner, anti-FOMO."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.5.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  google_fonts: ^6.0.0
  fl_chart: ^0.69.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  intl: ^0.20.2
  purchases_flutter: ^10.0.0
  url_launcher: ^6.3.0
  app_links: ^7.0.0
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  uuid: ^4.4.0
  timezone: ^0.9.0
  google_sign_in: ^6.2.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Logo Argento con Candele e P.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/Logo Argento con Candele e P.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/Icona PipLock.png
    - assets/images/Logo Argento con Candele e P.png
